source s_snort {
    file("/var/log/snort/snort.alert.fast"
        follow-freq(1)
        flags(no-parse)
        program-override("snort"));
};

parser p_snort {
    regexp-parser(
        prefix("snort.")
        patterns('^(?<ts>\S+)\s+\[\*\*\]\s+\[(?<gid>\d+):(?<sid>\d+):(?<rev>\d+)\]\s+(?<msg>.*?)\s+\[\*\*\](?:\s+\[Classification:\s+(?<classification>[^\]]+)\])?\s+\[Priority:\s+(?<priority>\d+)\]\s+\{(?<proto>[A-Za-z0-9]+)\}\s+(?<src_ip>\d+\.\d+\.\d+\.\d+)(?::(?<src_port>\d+))?\s+->\s+(?<dst_ip>\d+\.\d+\.\d+\.\d+)(?::(?<dst_port>\d+))?\s*$')
    );
};

destination d_elastic {
    elasticsearch-http(
        index("snort-${YEAR}.${MONTH}.${DAY}")
        type("")
        url("https://localhost:9200/_bulk")
        user("syslogng")
        password("cyberSOC")
        tls(ca-file("/etc/syslog-ng/certs/http_ca.crt") peer-verify(yes))
        template("$(format-json --key snort.* --pair @timestamp=${ISODATE} --pair host=${HOST} --pair message=${MESSAGE})")
    );
};

# Filtre : ne notifier sur Slack que les intrusions critiques (Priorite 1)
filter f_snort_critique {
    match("1" value("snort.priority"));
};

# Destination : envoi temps reel vers le script Python Slack
destination d_slack {
    program("/usr/local/bin/alerte_slack.py"
        template("$(format-json --key snort.* --pair @timestamp=${ISODATE})\n")
    );
};

# Pipeline 1 : Stockage de tous les logs dans Elasticsearch
log {
    source(s_snort);
    parser(p_snort);
    destination(d_elastic);
};

# Pipeline 2 : Notification temps reel Slack pour les alertes critiques
log {
    source(s_snort);
    parser(p_snort);
    filter(f_snort_critique);
    destination(d_slack);
};


